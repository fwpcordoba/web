<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root {
    --cian: #3fd8ff;
    --cian-suave: rgba(63, 216, 255, 0.35);
    --fondo: #01060b;
    --texto: #cfefff;
    --vidrio: rgba(4, 22, 34, 0.72);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(ellipse at 40% 50%, #072232 0%, var(--fondo) 65%);
    color: var(--texto); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; overflow: hidden;
  }

  /* ===== Zona de la esfera ===== */
  #escena { position: relative; flex: 1; min-width: 0; }
  #lienzo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #titulo {
    position: absolute; top: 22px; left: 0; right: 0; text-align: center; pointer-events: none;
    letter-spacing: 0.6em; font-weight: 300; font-size: 22px; color: var(--cian); text-shadow: 0 0 14px var(--cian);
  }
  #estado {
    position: absolute; bottom: 26px; left: 0; right: 0; text-align: center; pointer-events: none;
    font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.75;
  }

  /* ===== Panel que se abre desde un nodo ===== */
  #panel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(620px, 90%); max-height: 78%; overflow-y: auto;
    background: var(--vidrio); border: 1px solid var(--cian-suave); border-radius: 18px;
    box-shadow: 0 0 60px rgba(63, 216, 255, 0.15), inset 0 0 40px rgba(63, 216, 255, 0.06);
    backdrop-filter: blur(10px); padding: 22px 24px;
    clip-path: circle(0% at var(--ox, 50%) var(--oy, 50%));
    transition: clip-path 0.7s cubic-bezier(.7, 0, .2, 1), opacity 0.3s;
    opacity: 0; pointer-events: none;
  }
  #panel.abierto { clip-path: circle(150% at var(--ox, 50%) var(--oy, 50%)); opacity: 1; pointer-events: auto; }
  #panel h2 { margin: 0 0 14px; font-weight: 300; letter-spacing: 0.25em; color: var(--cian); text-transform: uppercase; font-size: 18px; }
  #cerrar {
    position: absolute; top: 14px; right: 16px; background: none; border: 1px solid var(--cian-suave);
    color: var(--cian); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px;
  }
  .grande { font-size: 56px; font-weight: 200; color: #fff; }
  .fila { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .dato { flex: 1; min-width: 110px; border: 1px solid var(--cian-suave); border-radius: 10px; padding: 10px 12px; }
  .dato small { display: block; opacity: 0.6; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; }
  .dato b { font-size: 18px; font-weight: 400; color: #fff; }
  .mapa { width: 100%; height: 230px; border: 0; border-radius: 12px; margin-top: 8px; filter: invert(0.9) hue-rotate(180deg) saturate(0.6); }
  .lista { list-style: none; padding: 0; margin: 0; }
  .lista li { padding: 10px 12px; border-bottom: 1px solid rgba(63, 216, 255, 0.12); }
  .lista button { all: unset; cursor: pointer; color: #fff; }
  .lista button:hover { color: var(--cian); }
  .pista { opacity: 0.6; font-size: 13px; margin-top: 12px; }

  /* ===== Barra lateral (chat) ===== */
  #lateral {
    width: 360px; display: flex; flex-direction: column; border-left: 1px solid rgba(63, 216, 255, 0.15);
    background: rgba(2, 12, 20, 0.6); padding: 18px;
  }
  #lateral h3 { margin: 0 0 12px; font-weight: 300; letter-spacing: 0.3em; font-size: 13px; color: var(--cian); }
  #log { flex: 1; overflow-y: auto; font-size: 14px; padding-right: 4px; }
  .msg { margin: 0 0 10px; line-height: 1.45; padding: 8px 10px; border-radius: 10px; }
  .yo { background: rgba(255, 255, 255, 0.05); color: #b9cdd8; }
  .jarvis { background: rgba(63, 216, 255, 0.08); color: var(--cian); }
  .aviso { color: #ffcf6b; font-size: 12px; background: none; padding: 2px 10px; }
  #formulario { display: flex; gap: 8px; margin-top: 12px; }
  #entrada {
    flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--cian-suave);
    background: #031520; color: #fff; font-size: 14px; outline: none;
  }
  #entrada:focus { border-color: var(--cian); }
  .boton {
    padding: 10px 14px; border-radius: 10px; border: 1px solid var(--cian); background: transparent;
    color: var(--cian); cursor: pointer; font-size: 14px;
  }
  .boton:hover { background: rgba(63, 216, 255, 0.12); }
  #llamada { margin-top: 10px; width: 100%; padding: 12px; letter-spacing: 0.15em; }
  #llamada.activa { background: rgba(63, 216, 255, 0.18); box-shadow: 0 0 18px rgba(63, 216, 255, 0.35); }

  /* ===== Pantalla de inicio ===== */
  #inicio {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    background: rgba(1, 6, 11, 0.9);
  }
  #inicio button { font-size: 16px; letter-spacing: 0.4em; padding: 18px 34px; }

  @media (max-width: 800px) {
    body { flex-direction: column; }
    #lateral { width: 100%; height: 45%; border-left: 0; border-top: 1px solid rgba(63, 216, 255, 0.15); }
  }
</style>
</head>
<body>
  <div id="inicio"><button class="boton" id="botonInicio">INICIAR SISTEMAS</button></div>

  <div id="escena">
    <canvas id="lienzo"></canvas>
    <div id="titulo">J.A.R.V.I.S.</div>
    <div id="estado">En espera</div>
    <div id="panel">
      <button id="cerrar" title="Cerrar">✕</button>
      <div id="contenido"></div>
    </div>
  </div>

  <aside id="lateral">
    <h3>REGISTRO</h3>
    <div id="log"></div>
    <form id="formulario">
      <input id="entrada" placeholder="Escribile a Jarvis..." autocomplete="off">
      <button class="boton" type="submit">Enviar</button>
    </form>
    <button class="boton" id="llamada">🎙️ LLAMADA: APAGADA</button>
  </aside>

<script>
/* =====================================================================
   ESTADO GENERAL
   ===================================================================== */
const $ = (id) => document.getElementById(id);
let estado = "espera";          // espera | escuchando | pensando | hablando
let nivelVoz = 0;               // qué tan fuerte habla Jarvis (0 a 1)
let nivelMic = 0;               // qué tan fuerte hablás vos (0 a 1)
let turno = 0;                  // para ignorar respuestas viejas si lo interrumpís
let audioCtx = null, analizador = null, fuenteActual = null;

const TEXTOS_ESTADO = {
  espera: "En espera", escuchando: "Te escucho...", pensando: "Procesando...",
  hablando: "Hablando", transcribiendo: "Entendiendo..."
};

function ponerEstado(nuevo, texto) {
  estado = nuevo;
  $("estado").textContent = texto || TEXTOS_ESTADO[nuevo] || nuevo;
}

function estadoReposo() {
  ponerEstado(llamadaActiva ? "escuchando" : "espera");
}

function agregar(quien, texto) {
  const div = document.createElement("div");
  div.className = "msg " + quien;
  div.textContent = texto;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
}

/* =====================================================================
   LA ESFERA (partículas en 3D dibujadas en un canvas)
   ===================================================================== */
const lienzo = $("lienzo");
const ctx2d = lienzo.getContext("2d");
let ancho = 0, alto = 0, escala = window.devicePixelRatio || 1;

function ajustarTamano() {
  const r = lienzo.getBoundingClientRect();
  ancho = r.width; alto = r.height;
  lienzo.width = ancho * escala; lienzo.height = alto * escala;
  ctx2d.setTransform(escala, 0, 0, escala, 0, 0);
}
window.addEventListener("resize", ajustarTamano);

// Puntos repartidos parejo sobre la esfera (espiral de Fibonacci)
const PUNTOS = [];
const CANTIDAD = 900;
for (let i = 0; i < CANTIDAD; i++) {
  const y = 1 - (i / (CANTIDAD - 1)) * 2;
  const radio = Math.sqrt(1 - y * y);
  const angulo = i * Math.PI * (3 - Math.sqrt(5));
  PUNTOS.push([Math.cos(angulo) * radio, y, Math.sin(angulo) * radio]);
}

// Los nodos: cada uno es una "app" de Jarvis. Para agregar más, sumá uno acá.
const NODOS = [
  { id: "clima",     nombre: "Clima",     lat: 25,  lon: 20 },
  { id: "proyectos", nombre: "Proyectos", lat: -28, lon: 110 },
  { id: "memoria",   nombre: "Memoria",   lat: 38,  lon: 200 },
  { id: "sistema",   nombre: "Sistema",   lat: -18, lon: 290 },
];
NODOS.forEach(n => {
  const la = n.lat * Math.PI / 180, lo = n.lon * Math.PI / 180;
  n.v = [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
});

let rotY = 0, rotX = 0.3, zoom = 1, tiempo = 0;
let foco = null;                 // nodo enfocado
let panelAbierto = false;

function rotar([x, y, z], ry, rx) {
  const x1 = x * Math.cos(ry) + z * Math.sin(ry);
  const z1 = -x * Math.sin(ry) + z * Math.cos(ry);
  const y2 = y * Math.cos(rx) - z1 * Math.sin(rx);
  const z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
  return [x1, y2, z2];
}

function proyectar([x, y, z], radio) {
  const p = 700 / (700 - z * radio);
  return [ancho / 2 + x * radio * p, alto / 2 - y * radio * p, p];
}

function acercarAngulo(actual, objetivo, velocidad) {
  let d = objetivo - actual;
  d = Math.atan2(Math.sin(d), Math.cos(d));      // camino más corto
  return actual + d * velocidad;
}

function dibujar() {
  tiempo += estado === "pensando" ? 0.045 : 0.016;
  const radioBase = Math.min(ancho, alto) * 0.3;

  // Movimiento: gira sola, o va hacia el nodo enfocado
  if (foco) {
    const [x, y, z] = foco.v;
    const h = Math.hypot(x, z);
    rotY = acercarAngulo(rotY, Math.atan2(-x, z), 0.08);
    rotX = acercarAngulo(rotX, Math.atan2(y, h), 0.08);
    zoom += (1.55 - zoom) * 0.07;
  } else {
    rotY += estado === "pensando" ? 0.02 : 0.004;
    rotX += (0.3 - rotX) * 0.03;
    zoom += (1 - zoom) * 0.06;
  }
  const radio = radioBase * zoom;

  // Cuánto se deforma según lo que está pasando
  let forma = 0.035;
  if (estado === "pensando") forma = 0.09;
  if (estado === "hablando") forma = 0.04 + nivelVoz * 0.35;
  if (estado === "escuchando") forma = 0.04 + nivelMic * 0.5;

  ctx2d.clearRect(0, 0, ancho, alto);

  // Halo de fondo
  const halo = ctx2d.createRadialGradient(ancho / 2, alto / 2, 0, ancho / 2, alto / 2, radio * 1.6);
  halo.addColorStop(0, `rgba(63,216,255,${0.10 + nivelVoz * 0.15})`);
  halo.addColorStop(1, "rgba(63,216,255,0)");
  ctx2d.fillStyle = halo;
  ctx2d.fillRect(0, 0, ancho, alto);

  // Partículas
  for (const p of PUNTOS) {
    const ruido = Math.sin(p[0] * 3 + tiempo * 1.3) * Math.sin(p[1] * 3 + tiempo * 1.1) * Math.sin(p[2] * 3 + tiempo * 0.9);
    const k = 1 + forma * ruido * 2;
    const [x, y, z] = rotar([p[0] * k, p[1] * k, p[2] * k], rotY, rotX);
    const [sx, sy, persp] = proyectar([x, y, z], radio);
    const brillo = 0.15 + (z + 1) * 0.42;
    const tam = (z > 0 ? 1.8 : 1.1) * persp;
    ctx2d.fillStyle = `rgba(${120 + z * 80},${225 + z * 20},255,${brillo})`;
    ctx2d.fillRect(sx, sy, tam, tam);
  }

  // Anillo orbital
  ctx2d.strokeStyle = "rgba(63,216,255,0.18)";
  ctx2d.lineWidth = 1;
  ctx2d.beginPath();
  ctx2d.ellipse(ancho / 2, alto / 2, radio * 1.25, radio * 0.3, tiempo * 0.15, 0, Math.PI * 2);
  ctx2d.stroke();

  // Nodos
  for (const n of NODOS) {
    const [x, y, z] = rotar(n.v, rotY, rotX);
    const [sx, sy, persp] = proyectar([x * 1.04, y * 1.04, z * 1.04], radio);
    n.pantalla = { x: sx, y: sy, adelante: z > -0.1 };
    const alfa = z > 0 ? 1 : 0.25;
    const pulso = 6 + Math.sin(tiempo * 3 + n.lon) * 1.5;
    const tam = pulso * persp * (foco === n ? 1.6 : 1);
    const g = ctx2d.createRadialGradient(sx, sy, 0, sx, sy, tam * 3);
    g.addColorStop(0, `rgba(255,255,255,${alfa})`);
    g.addColorStop(0.3, `rgba(63,216,255,${alfa * 0.9})`);
    g.addColorStop(1, "rgba(63,216,255,0)");
    ctx2d.fillStyle = g;
    ctx2d.beginPath(); ctx2d.arc(sx, sy, tam * 3, 0, Math.PI * 2); ctx2d.fill();
    if (z > 0 && !panelAbierto) {
      ctx2d.fillStyle = `rgba(207,239,255,${0.4 + z * 0.6})`;
      ctx2d.font = "12px Segoe UI, sans-serif";
      ctx2d.textAlign = "center";
      ctx2d.fillText(n.nombre.toUpperCase(), sx, sy - tam * 3 - 4);
    }
  }

  requestAnimationFrame(dibujar);
}

// Clic en un nodo
lienzo.addEventListener("click", (e) => {
  const r = lienzo.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const tocado = NODOS.find(n => n.pantalla && n.pantalla.adelante && Math.hypot(n.pantalla.x - mx, n.pantalla.y - my) < 26);
  if (tocado) abrirModulo(tocado.id);
});
lienzo.addEventListener("mousemove", (e) => {
  const r = lienzo.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const encima = NODOS.some(n => n.pantalla && n.pantalla.adelante && Math.hypot(n.pantalla.x - mx, n.pantalla.y - my) < 26);
  lienzo.style.cursor = encima ? "pointer" : "default";
});

/* =====================================================================
   PANELES (lo que se abre desde cada nodo)
   ===================================================================== */
async function abrirModulo(id, datos) {
  if (!datos) {
    try { datos = await (await fetch("/modulo/" + id)).json(); }
    catch { datos = { error: "Sin conexión con el servidor" }; }
  }
  const nodo = NODOS.find(n => n.id === id);
  cerrarPanel(true);
  foco = nodo;
  // Espera a que la esfera gire y se acerque al nodo, y después abre el panel
  setTimeout(() => {
    const panel = $("panel");
    $("contenido").innerHTML = PANELES[id](datos);
    panel.classList.add("abierto");
    panelAbierto = true;
  }, 650);
}

function cerrarPanel(soloPanel) {
  $("panel").classList.remove("abierto");
  panelAbierto = false;
  if (!soloPanel) foco = null;
}
$("cerrar").addEventListener("click", () => cerrarPanel());
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarPanel(); });

const limpiar = (t) => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

const PANELES = {
  clima(c) {
    if (c.error) return `<h2>Clima</h2><p>No pude obtener el clima. ¿Hay internet?</p>`;
    const d = 0.12;
    const mapa = `https://www.openstreetmap.org/export/embed.html?bbox=${c.lon - d},${c.lat - d},${c.lon + d},${c.lat + d}&layer=mapnik&marker=${c.lat},${c.lon}`;
    return `<h2>Clima · ${limpiar(c.ciudad)}</h2>
      <div class="grande">${c.temperatura}°</div>
      <div>${limpiar(c.estado)} · sensación ${c.sensacion}°</div>
      <div class="fila">
        <div class="dato"><small>Humedad</small><b>${c.humedad}%</b></div>
        <div class="dato"><small>Viento</small><b>${c.viento} km/h</b></div>
      </div>
      <div class="fila">${c.dias.map(x => `
        <div class="dato"><small>${DIAS[new Date(x.fecha + "T12:00").getDay()]}</small>
        <b>${x.max}° / ${x.min}°</b><br><span style="font-size:12px;opacity:.75">${limpiar(x.estado)} · lluvia ${x.lluvia ?? 0}%</span></div>`).join("")}
      </div>
      <iframe class="mapa" src="${mapa}" loading="lazy"></iframe>`;
  },
  proyectos(lista) {
    if (lista.error) return `<h2>Proyectos</h2><p>${limpiar(lista.error)}</p>`;
    const items = lista.map(p => `<li>${p.tipo === "carpeta" ? "📁" : "📄"} <button data-abrir="${limpiar(p.nombre)}">${limpiar(p.nombre)}</button></li>`).join("");
    return `<h2>Proyectos</h2>
      ${lista.length ? `<ul class="lista">${items}</ul>` : "<p>Todavía no hay proyectos.</p>"}
      <div class="pista">Agregá carpetas o archivos en <b>C:\\Jarvis\\proyectos</b>. Tocá uno para abrirlo, o decí "Jarvis, abrí el proyecto ...".</div>`;
  },
  memoria(lista) {
    const items = (lista || []).map(m => `<li>${limpiar(m)}</li>`).join("");
    return `<h2>Memoria</h2>
      ${items ? `<ul class="lista">${items}</ul>` : "<p>No hay recuerdos guardados.</p>"}
      <div class="pista">Decí o escribí "recordá que ..." para guardar algo nuevo.</div>`;
  },
  sistema(s) {
    return `<h2>Sistema</h2>
      <div class="grande">${limpiar(s.hora)}</div><div>${limpiar(s.fecha)}</div>
      <div class="fila">
        <div class="dato"><small>Mente</small><b>${limpiar(s.modelo)}</b></div>
        <div class="dato"><small>Voz</small><b>${limpiar(s.voz)}</b></div>
        <div class="dato"><small>Oído</small><b>${limpiar(s.oido)}</b></div>
        <div class="dato"><small>Recuerdos</small><b>${s.recuerdos}</b></div>
      </div>`;
  },
};

$("contenido").addEventListener("click", async (e) => {
  const nombre = e.target.dataset && e.target.dataset.abrir;
  if (!nombre) return;
  await fetch("/abrir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nombre }) });
  agregar("jarvis", "Abriendo " + nombre + ".");
});

/* =====================================================================
   CONVERSACIÓN
   ===================================================================== */
async function enviarTexto(texto) {
  const miTurno = ++turno;
  callar();
  ponerEstado("pensando");
  try {
    const r = await fetch("/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto })
    });
    const datos = await r.json();
    if (miTurno !== turno) return;            // lo interrumpiste: se descarta
    if (datos.panel === "cerrar") cerrarPanel();
    else if (datos.panel) abrirModulo(datos.panel, datos.datos);
    agregar("jarvis", datos.respuesta);
    await hablar(datos.respuesta, miTurno);
  } catch {
    agregar("aviso", "Perdí la conexión con el servidor. ¿Sigue abierta la ventana de PowerShell?");
    estadoReposo();
  }
}

$("formulario").addEventListener("submit", (e) => {
  e.preventDefault();
  const texto = $("entrada").value.trim();
  if (!texto) return;
  $("entrada").value = "";
  agregar("yo", texto);
  enviarTexto(texto);
});

/* =====================================================================
   VOZ DE JARVIS
   ===================================================================== */
const TONO = 0.93;   // menos de 1 = voz más grave

async function hablar(texto, miTurno) {
  if (!texto) { estadoReposo(); return; }
  try {
    const r = await fetch("/voz", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ texto })
    });
    if (miTurno !== turno) return;
    if (r.status === 200) {
      const audio = await audioCtx.decodeAudioData(await r.arrayBuffer());
      if (miTurno !== turno) return;
      const fuente = audioCtx.createBufferSource();
      fuente.buffer = audio;
      fuente.playbackRate.value = TONO;
      fuente.connect(analizador);
      fuente.onended = () => { if (fuenteActual === fuente) { fuenteActual = null; estadoReposo(); } };
      fuenteActual = fuente;
      ponerEstado("hablando");
      fuente.start();
      return;
    }
  } catch (e) { console.warn("Voz Piper no disponible:", e); }
  hablarNavegador(texto);
}

// Plan B: voz del navegador si Piper no está instalado
function hablarNavegador(texto) {
  const voces = speechSynthesis.getVoices().filter(v => v.lang.startsWith("es"));
  const hombre = voces.find(v => /raul|pablo|jorge|alvaro|tomas|diego|male|hombre/i.test(v.name));
  const frase = new SpeechSynthesisUtterance(texto);
  frase.voice = hombre || voces[0] || null;
  frase.lang = frase.voice ? frase.voice.lang : "es-ES";
  frase.pitch = 0.8; frase.rate = 1;
  frase.onstart = () => ponerEstado("hablando");
  frase.onend = frase.onerror = () => estadoReposo();
  speechSynthesis.speak(frase);
}

function callar() {
  if (fuenteActual) { try { fuenteActual.stop(); } catch {} fuenteActual = null; }
  speechSynthesis.cancel();
}

function jarvisHablando() {
  return !!fuenteActual || speechSynthesis.speaking;
}

// Mide el volumen de la voz de Jarvis para animar la esfera
function medirVoz() {
  if (analizador) {
    const datos = new Uint8Array(analizador.fftSize);
    analizador.getByteTimeDomainData(datos);
    let suma = 0;
    for (const v of datos) suma += ((v - 128) / 128) ** 2;
    const nivel = Math.min(1, Math.sqrt(suma / datos.length) * 4);
    nivelVoz += (nivel - nivelVoz) * 0.3;
    if (!fuenteActual && speechSynthesis.speaking) nivelVoz = 0.3 + Math.sin(Date.now() / 90) * 0.2;
  }
  requestAnimationFrame(medirVoz);
}

/* =====================================================================
   MODO LLAMADA (micrófono siempre escuchando + interrupción)
   ===================================================================== */
let llamadaActiva = false;
let microfono = null, procesador = null, ctxMic = null;

async function activarLlamada() {
  try {
    microfono = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch {
    agregar("aviso", "No pude usar el micrófono. Revisá que el navegador tenga permiso.");
    return;
  }
  ctxMic = new AudioContext();
  const entrada = ctxMic.createMediaStreamSource(microfono);
  procesador = ctxMic.createScriptProcessor(2048, 1, 1);
  entrada.connect(procesador);
  procesador.connect(ctxMic.destination);
  procesador.onaudioprocess = (e) => detectarVoz(e.inputBuffer.getChannelData(0), ctxMic.sampleRate);
  llamadaActiva = true;
  $("llamada").classList.add("activa");
  $("llamada").textContent = "🎙️ LLAMADA: ACTIVA";
  if (estado === "espera") ponerEstado("escuchando");
}

function desactivarLlamada() {
  llamadaActiva = false;
  if (procesador) procesador.disconnect();
  if (microfono) microfono.getTracks().forEach(t => t.stop());
  if (ctxMic) ctxMic.close();
  procesador = microfono = ctxMic = null;
  grabando = false; trozos = [];
  nivelMic = 0;
  $("llamada").classList.remove("activa");
  $("llamada").textContent = "🎙️ LLAMADA: APAGADA";
  if (estado === "escuchando") ponerEstado("espera");
}

$("llamada").addEventListener("click", () => llamadaActiva ? desactivarLlamada() : activarLlamada());

// Detector de voz: decide cuándo empezaste y cuándo terminaste de hablar
let grabando = false, trozos = [], previos = [];
let ruidoFondo = 0.01, msVoz = 0, msSilencio = 0, seguidos = 0;

function detectarVoz(muestras, frecuencia) {
  const copia = new Float32Array(muestras);
  const ms = (copia.length / frecuencia) * 1000;
  let suma = 0;
  for (const m of copia) suma += m * m;
  const rms = Math.sqrt(suma / copia.length);
  nivelMic = Math.min(1, rms * 12);

  // Si Jarvis está hablando, pide más volumen para no confundirse con su propia voz
  let umbral = Math.max(0.012, ruidoFondo * 3);
  if (jarvisHablando()) umbral *= 2.5;

  if (!grabando) {
    previos.push(copia);
    if (previos.length > 8) previos.shift();
    if (rms > umbral) {
      seguidos++;
      if (seguidos >= 3) {               // ~130 ms de voz seguida
        grabando = true;
        trozos = [...previos];
        msVoz = 0; msSilencio = 0;
        if (jarvisHablando()) {          // ¡lo interrumpiste!
          turno++;
          callar();
          agregar("aviso", "— Sí, te escucho.");
        }
        ponerEstado("escuchando", "Sí, te escucho...");
      }
    } else {
      seguidos = 0;
      ruidoFondo = ruidoFondo * 0.97 + rms * 0.03;
    }
    return;
  }

  trozos.push(copia);
  if (rms > umbral * 0.7) { msVoz += ms; msSilencio = 0; }
  else msSilencio += ms;

  if (msSilencio > 900 || msVoz > 20000) {   // terminaste de hablar
    grabando = false; seguidos = 0;
    const audio = trozos; trozos = [];
    if (msVoz > 350) enviarAudio(audio, frecuencia);
    else estadoReposo();
  }
}

// Junta el audio, lo pasa a 16 kHz y lo manda al oído (Whisper)
async function enviarAudio(trozos, frecuencia) {
  let largo = 0;
  for (const t of trozos) largo += t.length;
  const todo = new Float32Array(largo);
  let pos = 0;
  for (const t of trozos) { todo.set(t, pos); pos += t.length; }
  const factor = frecuencia / 16000;
  const salida = new Float32Array(Math.floor(todo.length / factor));
  for (let i = 0; i < salida.length; i++) salida[i] = todo[Math.floor(i * factor)];

  const miTurno = ++turno;
  ponerEstado("transcribiendo");
  try {
    const r = await fetch("/escuchar", { method: "POST", body: salida.buffer });
    const { texto, error } = await r.json();
    if (error) agregar("aviso", error);
    if (miTurno !== turno) return;
    if (!texto) { estadoReposo(); return; }
    agregar("yo", texto);
    enviarTexto(texto);
  } catch {
    estadoReposo();
  }
}

$("botonInicio").addEventListener("click", async () => {
  $("inicio").remove();
  audioCtx = new AudioContext();
  analizador = audioCtx.createAnalyser();
  analizador.fftSize = 1024;
  analizador.connect(audioCtx.destination);
  medirVoz();
  const saludo = "Sistemas en línea. Bienvenido, señor.";
  agregar("jarvis", saludo);
  hablar(saludo, turno);
  try {
    const s = await (await fetch("/estado")).json();
    if (!s.voz) agregar("aviso", "Voz de Jarvis no instalada: uso la voz del navegador.");
    if (s.oido_cargando) agregar("aviso", "El oído (Whisper) se está cargando. La primera vez tarda unos minutos.");
  } catch {}
  $("entrada").focus();
});

ajustarTamano();
dibujar();
